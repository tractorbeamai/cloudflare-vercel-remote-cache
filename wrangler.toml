name = "tractorbeam-turbo-cache"
account_id = "74bf2f1c3362ea5612cf0795fa1c78aa"
main = "src/index.ts"
compatibility_date = "2026-09-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Route 53 remains authoritative. Publish proxied DNS before enabling traffic.
routes = [{ pattern = "*.cache.tractorbeam.tools/*", zone_name = "tractorbeam.tools" }]

[observability]
enabled = true
head_sampling_rate = 0.1

[cache]
enabled = false

[vars]
ACCESS_ISSUER = "https://tractorbeamai.cloudflareaccess.com"
# Written by npm run setup after creating the single Access application.
ACCESS_AUD = ""
MAX_ARTIFACT_BYTES = 67108864

# Access service-token client IDs (not secrets) mapped to allowed project keys.
# No service identities are allowed until explicitly configured here and in Access.
[vars.SERVICE_PROJECTS]

# BEGIN GENERATED PROJECTS — npm run sync-projects
[vars.PROJECTS]
avathon = "Project: Avathon"
caddi = "Project: CADDi"
carlyle = "Project: Carlyle"
constellation = "Project: Constellation"
linden-investment = "Project: Linden (Investment)"
linden-tech = "Project: Linden (Tech)"
soc-2 = "Project: SOC 2"
tempus = "Project: Tempus"
# END GENERATED PROJECTS

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "tractorbeam-turbo-cache"

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }
